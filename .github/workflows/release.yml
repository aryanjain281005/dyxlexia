name: Release APK

# Builds an installable APK on every update to main and publishes it as a
# GitHub Release, so the newest build is always at:
# https://github.com/aryanjain281005/dyxlexia/releases/latest/download/akshara-path.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Signed with the debug key from the Flutter template: fine for
      # sideloading test builds, not for the Play Store.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk akshara-path.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" akshara-path.apk \
            --target "${{ github.sha }}" \
            --title "Akshara Path test build ${{ github.run_number }}" \
            --notes "Test build from ${{ github.sha }}. Install on Android by opening akshara-path.apk." \
            --latest
